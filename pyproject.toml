[project]
name = "target-revcrm"
version = "0.1.0"
description = "`target-revcrm` is a Singer target for RevCRM, built with the Meltano SDK for Singer Targets."
authors = [{ name = "Lior Ben-David", email = "lior@hotglue.io" }]
keywords = [
    "ELT",
    "revcrm",
]
license = "MIT"
requires-python = "<3.11,>=3.7.1"
dependencies = [
    "requests>=2.25.1",
    "hotglue-singer-sdk>=1.0.11",
]

[project.scripts]
target-revcrm = 'target_revcrm.target:TargetRevCRM.cli'

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
required-version = ">=0.15"
exclude = ["AGENTS.md"]

[tool.ruff.lint]
future-annotations = true
ignore = [
    "COM812",
    "CPY001",
    "FIX002",
    "TD002",
    "TD003",
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]
"target_revcrm/client.py" = [
    "ANN401",
    "D102",
    "I001",
]
"target_revcrm/sinks.py" = [
    "D102",
    "I001",
]
"target_revcrm/target.py" = [
    "RUF012",
    "I001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"
